name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          LDFLAGS="-s -w -X main.version=${VERSION}"

          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o webcastmate-linux-amd64 ./cmd/webcastmate
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o webcastmate-linux-arm64 ./cmd/webcastmate

      - name: Create checksums
        run: |
          sha256sum webcastmate-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            webcastmate-linux-amd64
            webcastmate-linux-arm64
            checksums.txt
          body: |
            ## webcastmate ${{ steps.get_version.outputs.VERSION }}

            多平台直播协议 CLI（无浏览器）：登录 → 开播拿 RTMP → 写 live.json → 关播。

            ### 下载

            - **Linux (x86_64)**: `webcastmate-linux-amd64`
            - **Linux (ARM64)**: `webcastmate-linux-arm64`

            ### 使用

            ```bash
            chmod +x webcastmate-linux-amd64
            ./webcastmate-linux-amd64 start bilibili
            ```

            支持平台：`bilibili` `douyin` `xiaohongshu`。

            ### 校验

            ```bash
            sha256sum -c checksums.txt
            ```

            ### 更新日志

            查看 commit 历史了解详细更新内容。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
